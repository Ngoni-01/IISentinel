services:
  - type: web
    name: sentinel
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn sentinel.api.app:app --workers 1 --threads 16 --worker-tmp-dir /dev/shm --timeout 120 --bind 0.0.0.0:$PORT
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/sentinel.db
