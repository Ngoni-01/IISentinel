<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#04070d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050d1a'/%3E%3Ctext x='32' y='44' font-size='34' font-weight='900' font-family='-apple-system,sans-serif' fill='%2300d4ff' text-anchor='middle'%3EII%3C/text%3E%3C/svg%3E">
<title>Cascade Studio — IISentinel</title>
<style>
:root{
  --bg:#04070d;--txt:#e9effc;--sub:#8fa0bd;--dim:#4b5b78;
  --line:rgba(255,255,255,.08);--glass:rgba(10,17,30,.72);
  --cyan:#00d4ff;--green:#31e98c;--amber:#ffb648;--red:#ff4b68;--purple:#b07cff;--gold:#ffc94d;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
  --mono:'SF Mono',ui-monospace,Consolas,monospace;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:var(--font);font-size:13px;letter-spacing:-.01em}

/* ambient background — aurora orbs, never static */
#ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#ambient::before,#ambient::after{content:'';position:absolute;border-radius:50%;filter:blur(90px);opacity:.34}
#ambient::before{width:56vw;height:56vw;left:-16vw;top:-24vh;
  background:radial-gradient(circle,#0a3d5c,transparent 65%);animation:amb1 24s ease-in-out infinite}
#ambient::after{width:48vw;height:48vw;right:-14vw;bottom:-22vh;
  background:radial-gradient(circle,#3d1560,transparent 65%);animation:amb2 30s ease-in-out infinite}
@keyframes amb1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(7vw,5vh) scale(1.18)}}
@keyframes amb2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6vw,-6vh) scale(1.14)}}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
  background-image:radial-gradient(rgba(255,255,255,.6) .5px,transparent .5px);background-size:3px 3px}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}

/* top bar */
#bar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 16px;
  border-bottom:1px solid var(--line);background:rgba(4,7,13,.66);
  backdrop-filter:blur(22px) saturate(1.5)}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}
.lmark{width:30px;height:30px;border-radius:9px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0a2438,#071522);border:1px solid rgba(0,212,255,.3);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px -4px rgba(0,212,255,.45)}
.lmark::before{content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.15) 48%,transparent 62%);
  animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,72%,100%{transform:translateX(-120%)}36%{transform:translateX(120%)}}
.lmark span{font-size:14px;font-weight:900;letter-spacing:-.09em;
  background:linear-gradient(180deg,#8feaff,#00d4ff 58%,#0899c9);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ltxt{font-size:14px;font-weight:800;letter-spacing:-.02em}
.ltxt small{color:var(--dim);font-weight:600;font-size:10px;margin-left:7px;
  text-transform:uppercase;letter-spacing:.16em}
.bar-sp{flex:1}
.btn{height:34px;padding:0 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.045);color:var(--sub);font-size:11.5px;font-weight:650;
  cursor:pointer;transition:all .28s var(--spring);display:inline-flex;align-items:center;gap:7px;
  font-family:var(--font);white-space:nowrap}
.btn:hover{color:var(--txt);border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.08)}
.btn:active{transform:scale(.94)}
.btn.primary{background:linear-gradient(135deg,rgba(0,212,255,.18),rgba(0,140,200,.12));
  border-color:rgba(0,212,255,.35);color:#9fe9ff}
.btn.danger{border-color:rgba(255,75,104,.35);color:#ff9bac}
.btn:disabled{opacity:.4;pointer-events:none}

/* scenario strip */
#scen{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 16px;
  overflow-x:auto;border-bottom:1px solid var(--line);background:rgba(4,7,13,.4)}
.sc{height:38px;padding:0 15px;border-radius:13px;border:1px solid var(--line);cursor:pointer;
  background:rgba(255,255,255,.04);display:inline-flex;align-items:center;gap:9px;flex-shrink:0;
  font-size:11.5px;font-weight:700;color:var(--sub);transition:all .3s var(--spring)}
.sc:hover{transform:translateY(-2px);color:var(--txt);border-color:rgba(255,255,255,.18)}
.sc i{width:9px;height:9px;border-radius:50%;font-style:normal;flex-shrink:0;
  box-shadow:0 0 8px currentColor}
.sc.running{border-color:var(--c,#00d4ff);color:var(--txt);
  box-shadow:0 0 0 1px var(--c,#00d4ff) inset,0 6px 22px -8px var(--c,#00d4ff)}
.sc small{font-weight:600;color:var(--dim);font-size:9.5px}

/* stage */
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:default}

/* watermark handled in-canvas */

/* HUD chips over canvas */
#hud{position:absolute;left:14px;top:12px;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.hchip{pointer-events:auto;padding:8px 13px;border-radius:13px;background:var(--glass);
  border:1px solid var(--line);backdrop-filter:blur(14px);font-size:10.5px;color:var(--sub);
  display:flex;align-items:center;gap:9px}
.hchip b{font-family:var(--mono);color:var(--txt);font-weight:700}
.hchip .live{width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:blink 2.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* zoom controls */
#zc{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zb{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);cursor:pointer;
  background:var(--glass);backdrop-filter:blur(14px);color:var(--sub);font-size:15px;
  transition:all .25s var(--spring)}
.zb:hover{color:var(--txt);transform:scale(1.08)}

/* impact side panel */
#panel{position:absolute;top:12px;right:14px;width:min(320px,86vw);max-height:calc(100% - 26px);
  display:flex;flex-direction:column;gap:10px;pointer-events:none}
.pcard{pointer-events:auto;background:var(--glass);border:1px solid var(--line);border-radius:18px;
  padding:15px 17px;backdrop-filter:blur(18px) saturate(1.4);
  animation:slideIn .45s var(--spring)}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.pt{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);
  margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pt .x{margin-left:auto;cursor:pointer;color:var(--dim);font-size:12px}
.pt .x:hover{color:var(--red)}
.imp-row{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:12px}
.imp-row span{color:var(--sub)}
.imp-row b{font-family:var(--mono);font-weight:800}
#evlog{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
#evlog::-webkit-scrollbar{width:4px}
#evlog::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:2px}
.ev{font-size:10.5px;line-height:1.5;padding:7px 10px;border-radius:10px;
  background:rgba(255,255,255,.035);border-left:2px solid var(--c,#00d4ff);
  animation:evIn .3s var(--ease)}
@keyframes evIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.ev b{color:var(--txt)}.ev time{color:var(--dim);font-family:var(--mono);font-size:9px;margin-right:6px}

/* node detail rows */
.nd-kv{display:flex;justify-content:space-between;padding:5px 0;font-size:11.5px;border-bottom:1px solid rgba(255,255,255,.05)}
.nd-kv:last-child{border:none}
.nd-kv span{color:var(--sub)}.nd-kv b{font-family:var(--mono)}

/* tooltip */
#tip{position:absolute;pointer-events:none;z-index:20;padding:8px 12px;border-radius:11px;
  background:rgba(8,14,26,.96);border:1px solid rgba(255,255,255,.14);font-size:11px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);opacity:0;transition:opacity .15s;max-width:220px}
#tip b{display:block;font-size:11.5px;margin-bottom:2px}
#tip span{color:var(--sub);font-size:10px}

/* toast */
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{padding:10px 20px;border-radius:14px;background:rgba(9,16,30,.95);
  border:1px solid var(--line);font-size:12px;font-weight:600;
  box-shadow:0 14px 40px rgba(0,0,0,.5);animation:slideUp .4s var(--spring)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@media(max-width:720px){
  .ltxt small{display:none}
  #panel{width:min(260px,80vw)}
  .sc small{display:none}
}
</style>
</head>
<body>
<div id="ambient"></div><div class="grain"></div>
<div id="app">
  <div id="bar">
    <div class="logo" onclick="location.href='/'">
      <div class="lmark"><span>II</span></div>
      <div class="ltxt">Cascade Studio<small>failure propagation twin</small></div>
    </div>
    <div class="bar-sp"></div>
    <button class="btn" onclick="fitView()">&#x26F6; Fit</button>
    <button class="btn" id="edit-btn" onclick="toggleEdit()">&#x270E; Edit</button>
    <button class="btn danger" id="stop-btn" onclick="stopSim()" disabled>&#x25A0; Stop</button>
    <button class="btn primary" onclick="location.href='/'">&larr; Sentinel</button>
  </div>

  <div id="scen">
    <div class="sc" data-c="#22c9e8" onclick="runScenario('net')" id="sc-net">
      <i style="color:#22c9e8;background:#22c9e8"></i>Network outage<small>core switch down</small></div>
    <div class="sc" data-c="#37b6ff" onclick="runScenario('tc')" id="sc-tc">
      <i style="color:#37b6ff;background:#37b6ff"></i>Telecom backhaul loss<small>microwave link fade</small></div>
    <div class="sc" data-c="#ffc94d" onclick="runScenario('mc')" id="sc-mc">
      <i style="color:#ffc94d;background:#ffc94d"></i>Mining pump cascade<small>thermal runaway</small></div>
    <div class="sc" data-c="#ff4b68" onclick="runScenario('cbs')" id="sc-cbs">
      <i style="color:#ff4b68;background:#ff4b68"></i>CBS integrity breach<small>interlock trip</small></div>
    <div class="sc" data-c="#b07cff" onclick="runScenario('storm')" id="sc-storm">
      <i style="color:#b07cff;background:#b07cff"></i>Full-system storm<small>multi-sector</small></div>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="hchip"><span class="live" id="live-dot"></span><span id="hud-mode">LIVE twin</span></div>
      <div class="hchip">Nodes <b id="hud-n">0</b> &middot; Links <b id="hud-e">0</b></div>
    </div>
    <div id="zc">
      <button class="zb" onclick="zoom(1.25)">+</button>
      <button class="zb" onclick="zoom(0.8)">&minus;</button>
      <button class="zb" onclick="fitView()" title="fit">&#x26F6;</button>
    </div>
    <div id="panel"></div>
    <div id="tip"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
'use strict';
// ═══════════ CASCADE STUDIO ENGINE — clean-room build ═══════════
var B=location.origin;
var SECT={net:{n:'Network',c:'#22c9e8'},tc:{n:'Telecom',c:'#37b6ff'},
          mc:{n:'Mining',c:'#ffc94d'},cbs:{n:'CBS',c:'#ff4b68'}};
var COST={router:12000,switch:8000,firewall:15000,wan_link:20000,workstation:1500,
  base_station:25000,network_tower:30000,microwave_link:22000,
  pump:150000,conveyor:80000,ventilation:120000,power_meter:10000,sensor:5000,
  plc:60000,scada_node:45000,cbs_controller:450000};
function hcol(s){return s>=70?'#31e98c':s>=35?'#ffb648':'#ff4b68';}
function $(i){return document.getElementById(i);}
function toast(m){var t=document.createElement('div');t.className='toast';t.textContent=m;
  $('toasts').appendChild(t);setTimeout(function(){t.style.opacity='0';t.style.transition='opacity .4s';
  setTimeout(function(){t.remove();},400);},3400);}

// ── state ──
var nodes=[],edges=[],byId={};
var live={};                 // id -> live health
var sim=null;                // {overrides:{id:score}, timer, name, color, startedCost, events}
var view={x:0,y:0,s:1,tx:null,ty:null,ts:null};
var W=0,H=0,DPR=Math.min(devicePixelRatio||1,2);
var cv,ctx,hoverN=null,dragN=null,selN=null,focusSet=null,panning=false,px=0,py=0;
var editMode=false,edgeFirst=null;
var particles=[];            // {e:edge, t:0..1, col}
var shakeT=0;

// ── sizing: THE fix — fluid, container-driven, never letterboxed ──
function resize(){
  var st=$('stage');W=st.clientWidth;H=st.clientHeight;
  cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
new ResizeObserver(function(){resize();}).observe(document.getElementById('stage'));

// ── topology: saved layout OR derived from live snapshot ──
async function loadTopology(){
  var snap=null;
  try{snap=await(await fetch(B+'/api/snapshot',{cache:'no-store'})).json();}catch(e){}
  var saved=null;
  try{
    var t=await(await fetch(B+'/api/cascade/topology',{cache:'no-store'})).json();
    if(t&&t.nodes&&t.nodes.length)saved=t;
  }catch(e){}
  var data=(snap&&snap.data)||[];
  data.forEach(function(r){live[r.device_id]=r.health_score;});
  if(saved){
    nodes=saved.nodes.map(function(n){return {id:n.id,label:n.label||short(n.id),
      sector:n.sector||n.domain||'net',type:n.type||'',x:n.x||Math.random()*600,
      y:n.y||Math.random()*400,vx:0,vy:0,fixed:!!n.fixed};});
    edges=(saved.edges||[]).map(function(e){return {a:e.source||e.a,b:e.target||e.b};});
  }else{
    buildFromSnapshot(data);
  }
  // ensure any live device missing from saved topo is added
  data.forEach(function(r){
    if(!nodes.some(function(n){return n.id===r.device_id;})){
      addDeviceNode(r);
    }
  });
  index();settle(240);fitView();
  $('hud-n').textContent=nodes.filter(function(n){return !n.hub&&!n.core;}).length;
  $('hud-e').textContent=edges.length;
}
function short(id){var p=String(id).split('-');return p.length>2?p.slice(-2).join('-'):id;}
function sectorOfType(t){
  if(t==='cbs_controller')return 'cbs';
  if(['pump','conveyor','ventilation','power_meter','sensor','plc','scada_node'].indexOf(t)>=0)return 'mc';
  if(['base_station','network_tower','microwave_link'].indexOf(t)>=0)return 'tc';
  return 'net';
}
function buildFromSnapshot(data){
  nodes=[{id:'__core',label:'SENTINEL',core:true,x:0,y:0,vx:0,vy:0,fixed:true}];
  edges=[];
  var groups={};
  data.forEach(function(r){var s=sectorOfType(r.device_type);(groups[s]=groups[s]||[]).push(r);});
  var secs=Object.keys(groups);
  secs.forEach(function(s,i){
    var ang=(i/secs.length)*Math.PI*2-Math.PI/2;
    var hx=Math.cos(ang)*220,hy=Math.sin(ang)*220;
    nodes.push({id:'__hub-'+s,label:SECT[s].n,hub:s,x:hx,y:hy,vx:0,vy:0});
    edges.push({a:'__core',b:'__hub-'+s});
    groups[s].forEach(function(r,j){
      var a2=ang+(j-(groups[s].length-1)/2)*0.5;
      nodes.push({id:r.device_id,label:short(r.device_id),sector:s,type:r.device_type,
        x:hx+Math.cos(a2)*150,y:hy+Math.sin(a2)*150,vx:0,vy:0});
      edges.push({a:'__hub-'+s,b:r.device_id});
    });
  });
  // cross-sector dependencies (mining depends on network; cbs on telecom link)
  if(groups.mc&&groups.net){edges.push({a:'__hub-net',b:'__hub-mc'});}
  if(groups.cbs&&groups.tc){edges.push({a:'__hub-tc',b:'__hub-cbs'});}
}
function addDeviceNode(r){
  var s=sectorOfType(r.device_type);
  var hub=nodes.find(function(n){return n.id==='__hub-'+s;});
  if(!hub){hub={id:'__hub-'+s,label:(SECT[s]||{n:s}).n,hub:s,x:(Math.random()-0.5)*360,
    y:(Math.random()-0.5)*300,vx:0,vy:0};nodes.push(hub);
    edges.push({a:'__core',b:hub.id});}
  nodes.push({id:r.device_id,label:short(r.device_id),sector:s,type:r.device_type,
    x:hub.x+(Math.random()-0.5)*180,y:hub.y+(Math.random()-0.5)*180,vx:0,vy:0});
  edges.push({a:hub.id,b:r.device_id});
}
function index(){byId={};nodes.forEach(function(n){byId[n.id]=n;});}

// ── physics (short settle bursts, not endless jitter) ──
var settleSteps=0;
function settle(n){settleSteps=Math.max(settleSteps,n);}
function physics(){
  if(settleSteps<=0&&!dragN)return;
  if(settleSteps>0)settleSteps--;
  var i,j;
  for(i=0;i<nodes.length;i++){
    var a=nodes[i];if(a.fixed&&a!==dragN)continue;
    var fx=0,fy=0;
    for(j=0;j<nodes.length;j++){
      if(i===j)continue;var b=nodes[j];
      var dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);
      var rep=(a.hub||a.core||b.hub||b.core)?5200:2600;
      fx+=dx/d*rep/d2*60;fy+=dy/d*rep/d2*60;
    }
    fx+=-a.x*0.004;fy+=-a.y*0.004; // gentle centering
    a.vx=(a.vx+fx*0.016)*0.86;a.vy=(a.vy+fy*0.016)*0.86;
  }
  edges.forEach(function(e){
    var a=byId[e.a],b=byId[e.b];if(!a||!b)return;
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    var rest=(a.core||b.core)?220:(a.hub||b.hub)?150:110;
    var f=(d-rest)*0.012;
    if(!a.fixed){a.vx+=dx/d*f;a.vy+=dy/d*f;}
    if(!b.fixed){b.vx-=dx/d*f;b.vy-=dy/d*f;}
  });
  nodes.forEach(function(n){if(n.fixed&&n!==dragN)return;n.x+=n.vx;n.y+=n.vy;});
}

// ── score resolution: sim overrides > live ──
function scoreOf(id){
  if(sim&&sim.overrides[id]!==undefined)return sim.overrides[id];
  return live[id]!==undefined?live[id]:null;
}

// ── render ──
function world2screen(x,y){return [x*view.s+view.x+W/2, y*view.s+view.y+H/2];}
function screen2world(sx,sy){return [(sx-W/2-view.x)/view.s,(sy-H/2-view.y)/view.s];}
var T=0;
function draw(){
  T+=0.016;
  // smooth view targets
  if(view.tx!==null){view.x+=(view.tx-view.x)*0.13;view.y+=(view.ty-view.y)*0.13;
    view.s+=(view.ts-view.s)*0.13;
    if(Math.abs(view.tx-view.x)<0.4&&Math.abs(view.ts-view.s)<0.003){view.tx=null;}}
  var sh=shakeT>0?(Math.random()-0.5)*shakeT*7:0;
  var sh2=shakeT>0?(Math.random()-0.5)*shakeT*7:0;
  if(shakeT>0)shakeT-=0.02;
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(sh,sh2);

  // WATERMARK — Sentinel logo, breathing
  ctx.save();
  var wa=0.045+Math.sin(T*0.6)*0.012;
  ctx.globalAlpha=wa;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='900 '+Math.min(W,H)*0.34+'px '+getComputedStyle(document.body).fontFamily;
  ctx.fillStyle='#00d4ff';
  ctx.fillText('II',W/2,H/2-Math.min(W,H)*0.03);
  ctx.font='700 '+Math.min(W,H)*0.052+'px '+getComputedStyle(document.body).fontFamily;
  ctx.fillStyle='#cfe2ff';
  ctx.fillText('S E N T I N E L',W/2,H/2+Math.min(W,H)*0.17);
  ctx.restore();

  // edges
  edges.forEach(function(e){
    var a=byId[e.a],b=byId[e.b];if(!a||!b)return;
    var A=world2screen(a.x,a.y),Bp=world2screen(b.x,b.y);
    var sa=scoreOf(a.id),sb=scoreOf(b.id);
    var worst=Math.min(sa===null?100:sa,sb===null?100:sb);
    var dim=focusSet&&!(focusSet.has(a.id)&&focusSet.has(b.id));
    ctx.globalAlpha=dim?0.08:1;
    var grad=ctx.createLinearGradient(A[0],A[1],Bp[0],Bp[1]);
    var c1=sa===null?'#33475f':hcol(sa),c2=sb===null?'#33475f':hcol(sb);
    grad.addColorStop(0,c1+'55');grad.addColorStop(1,c2+'55');
    ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(Bp[0],Bp[1]);
    ctx.strokeStyle=worst<35?'rgba(255,75,104,.6)':grad;
    ctx.lineWidth=(worst<35?1.9:1.1)*Math.min(1.4,view.s);
    if(worst<35)ctx.setLineDash([6,5]);
    ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;
  });

  // particles (cascade energy)
  particles=particles.filter(function(p){return p.t<=1;});
  particles.forEach(function(p){
    var a=byId[p.e.a],b=byId[p.e.b];if(!a||!b){p.t=2;return;}
    p.t+=p.v;
    var A=world2screen(a.x,a.y),Bp=world2screen(b.x,b.y);
    var x=A[0]+(Bp[0]-A[0])*p.t,y=A[1]+(Bp[1]-A[1])*p.t;
    ctx.beginPath();ctx.arc(x,y,2.6*Math.min(1.4,view.s),0,7);
    ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
  });

  // nodes
  nodes.forEach(function(n){
    var P=world2screen(n.x,n.y);var x=P[0],y=P[1];
    var dim=focusSet&&!focusSet.has(n.id);
    ctx.globalAlpha=dim?0.14:1;
    var fam=getComputedStyle(document.body).fontFamily;
    if(n.core){
      var r=22*view.s;
      var g=ctx.createRadialGradient(x,y,2,x,y,r);
      g.addColorStop(0,'rgba(0,212,255,.5)');g.addColorStop(1,'rgba(0,212,255,.05)');
      ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(0,212,255,.5)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#a5edff';ctx.font='900 '+11*view.s+'px '+fam;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('II',x,y);
      ctx.globalAlpha=1;return;
    }
    if(n.hub){
      var sc=SECT[n.hub]||{c:'#8fa0bd',n:n.hub};var r2=15*view.s;
      ctx.beginPath();ctx.arc(x,y,r2,0,7);
      ctx.fillStyle=sc.c+'1f';ctx.fill();
      ctx.strokeStyle=sc.c+'99';ctx.lineWidth=1.4;ctx.stroke();
      ctx.fillStyle='rgba(215,230,250,.85)';ctx.font='700 '+10*view.s+'px '+fam;
      ctx.textAlign='center';ctx.fillText(sc.n,x,y+r2+13*view.s);
      ctx.globalAlpha=1;n._sx=x;n._sy=y;n._r=r2;return;
    }
    var s=scoreOf(n.id);var col=s===null?'#4b5b78':hcol(s);
    var r3=11*view.s;var hov=hoverN===n||selN===n;
    if(s!==null&&s<35){
      var pu=Math.sin(T*4+n.x)*0.5+0.5;
      ctx.beginPath();ctx.arc(x,y,r3+5+pu*5,0,7);
      ctx.strokeStyle='rgba(255,75,104,'+(0.14+pu*0.2)+')';ctx.lineWidth=1.6;ctx.stroke();
    }
    ctx.shadowColor=col;ctx.shadowBlur=hov?20:9;
    ctx.beginPath();ctx.arc(x,y,r3+(hov?2:0),0,7);
    var g3=ctx.createRadialGradient(x-3,y-3,1,x,y,r3);
    g3.addColorStop(0,col+'77');g3.addColorStop(1,col+'16');
    ctx.fillStyle=g3;ctx.fill();
    ctx.strokeStyle=col;ctx.lineWidth=hov?2.1:1.3;ctx.stroke();ctx.shadowBlur=0;
    ctx.fillStyle=col;ctx.font='800 '+8.5*view.s+'px '+fam;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(s===null?'?':Math.round(s),x,y);
    if(hov||view.s>1.35){
      ctx.fillStyle='rgba(233,240,252,.9)';ctx.font='600 '+9.5*Math.min(1.15,view.s)+'px '+fam;
      ctx.fillText(n.label,x,y+r3+12);
    }
    if(editMode&&edgeFirst===n){
      ctx.beginPath();ctx.arc(x,y,r3+7,0,7);
      ctx.setLineDash([4,3]);ctx.strokeStyle='rgba(0,212,255,.85)';ctx.lineWidth=1.8;
      ctx.stroke();ctx.setLineDash([]);
    }
    n._sx=x;n._sy=y;n._r=r3;
    ctx.globalAlpha=1;
  });
  ctx.restore();
}
function loop(){physics();draw();requestAnimationFrame(loop);}

// ── interactions ──
function nodeAt(sx,sy){
  for(var i=nodes.length-1;i>=0;i--){var n=nodes[i];
    if(n.core)continue;
    var dx=(n._sx||0)-sx,dy=(n._sy||0)-sy;
    if(dx*dx+dy*dy<((n._r||10)+7)*((n._r||10)+7))return n;}
  return null;
}
function bind(){
  cv.addEventListener('mousedown',function(e){
    var r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    var n=nodeAt(mx,my);
    if(n&&!n.hub){dragN=n;n.fixed=true;settle(20);}
    else{panning=true;px=e.clientX;py=e.clientY;cv.style.cursor='grabbing';}
  });
  cv.addEventListener('mousemove',function(e){
    var r=cv.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
    if(dragN){var w=screen2world(mx,my);dragN.x=w[0];dragN.y=w[1];settle(8);return;}
    if(panning){view.x+=e.clientX-px;view.y+=e.clientY-py;px=e.clientX;py=e.clientY;view.tx=null;return;}
    hoverN=nodeAt(mx,my);
    cv.style.cursor=hoverN?'pointer':'default';
    var tip=$('tip');
    if(hoverN&&!hoverN.hub){
      var s=scoreOf(hoverN.id);
      tip.innerHTML='<b>'+hoverN.label+'</b><span>'+(hoverN.type||'device')
        +' &middot; health '+(s===null?'—':Math.round(s))+'/100'
        +(sim?'<br>simulated state':'')+'</span>';
      tip.style.left=Math.min(W-230,mx+16)+'px';tip.style.top=(my+14)+'px';tip.style.opacity='1';
    }else tip.style.opacity='0';
  });
  window.addEventListener('mouseup',function(){
    if(dragN){dragN.fixed=false;dragN=null;}
    panning=false;cv.style.cursor=hoverN?'pointer':'default';
  });
  cv.addEventListener('click',function(e){
    if(dragN)return;
    var r=cv.getBoundingClientRect(),n=nodeAt(e.clientX-r.left,e.clientY-r.top);
    if(editMode&&n&&!n.hub){
      if(!edgeFirst){edgeFirst=n;toast('Now click a second node to link');}
      else if(edgeFirst!==n){
        var exists=edges.some(function(ed){return (ed.a===edgeFirst.id&&ed.b===n.id)||(ed.a===n.id&&ed.b===edgeFirst.id);});
        if(exists){edges=edges.filter(function(ed){return !((ed.a===edgeFirst.id&&ed.b===n.id)||(ed.a===n.id&&ed.b===edgeFirst.id));});toast('Link removed');}
        else{edges.push({a:edgeFirst.id,b:n.id});toast('Link created');}
        edgeFirst=null;settle(60);$('hud-e').textContent=edges.length;
      }
      return;
    }
    if(n&&!n.hub){select(n);}else{select(null);}
  });
  cv.addEventListener('dblclick',function(e){
    var r=cv.getBoundingClientRect(),n=nodeAt(e.clientX-r.left,e.clientY-r.top);
    if(n){view.ts=1.7;view.tx=W/2-n.x*1.7-W/2;view.ty=H/2-n.y*1.7-H/2;
      view.tx=-n.x*1.7;view.ty=-n.y*1.7;}
    else fitView();
  });
  cv.addEventListener('wheel',function(e){
    e.preventDefault();
    zoom(e.deltaY<0?1.12:0.9,e);
  },{passive:false});
  // touch: pan + pinch
  var lastT=null,lastD=null;
  cv.addEventListener('touchstart',function(e){
    if(e.touches.length===1){var t=e.touches[0];lastT=[t.clientX,t.clientY];
      var r=cv.getBoundingClientRect();var n=nodeAt(t.clientX-r.left,t.clientY-r.top);
      if(n&&!n.hub)select(n);}
    if(e.touches.length===2){lastD=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY);}
  },{passive:true});
  cv.addEventListener('touchmove',function(e){
    if(e.touches.length===1&&lastT){var t=e.touches[0];
      view.x+=t.clientX-lastT[0];view.y+=t.clientY-lastT[1];lastT=[t.clientX,t.clientY];view.tx=null;}
    if(e.touches.length===2&&lastD){
      var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY);
      view.s=Math.max(0.3,Math.min(2.6,view.s*(d/lastD)));lastD=d;}
    e.preventDefault();
  },{passive:false});
  cv.addEventListener('touchend',function(){lastT=null;lastD=null;});
}
function zoom(f,e){
  var ns=Math.max(0.3,Math.min(2.6,view.s*f));
  view.s=ns;view.tx=null;
}
function fitView(){
  var real=nodes.filter(function(n){return !n.core;});
  if(!real.length)return;
  var minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  real.forEach(function(n){minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);
    minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y);});
  var pad=90;
  var ts=Math.max(0.35,Math.min(1.8,Math.min((W-pad*2)/Math.max(60,maxX-minX),(H-pad*2)/Math.max(60,maxY-minY))));
  view.ts=ts;view.tx=-((minX+maxX)/2)*ts;view.ty=-((minY+maxY)/2)*ts;
}
function select(n){
  selN=n;
  if(!n){focusSet=null;renderPanel();return;}
  focusSet=new Set([n.id]);
  edges.forEach(function(e){
    if(e.a===n.id)focusSet.add(e.b);
    if(e.b===n.id)focusSet.add(e.a);
  });
  renderPanel();
}
function toggleEdit(){
  editMode=!editMode;edgeFirst=null;
  $('edit-btn').classList.toggle('primary',editMode);
  toast(editMode?'Edit mode: click two nodes to link/unlink':'Edit mode off');
}

// ── SIMULATION ENGINE ──
var SCEN={
  net:{name:'Network outage',color:'#22c9e8',seed:function(){return seedWorst('net')},msg:'Core switch failure injected'},
  tc:{name:'Telecom backhaul loss',color:'#37b6ff',seed:function(){return seedWorst('tc')},msg:'Microwave link fade injected'},
  mc:{name:'Mining pump cascade',color:'#ffc94d',seed:function(){return seedWorst('mc','pump')},msg:'Pump thermal runaway injected'},
  cbs:{name:'CBS integrity breach',color:'#ff4b68',seed:function(){return seedType('cbs_controller')},msg:'DNP3 integrity degradation injected'},
  storm:{name:'Full-system storm',color:'#b07cff',
    seed:function(){var a=seedWorst('net'),b=seedWorst('mc');return [].concat(a,b);},
    msg:'Multi-sector storm injected'}
};
function seedWorst(sector,prefType){
  var cands=nodes.filter(function(n){return n.sector===sector&&!n.hub&&!n.core;});
  if(prefType){var t=cands.filter(function(n){return n.type===prefType;});if(t.length)cands=t;}
  if(!cands.length)return [];
  cands.sort(function(a,b){return (scoreOf(a.id)||100)-(scoreOf(b.id)||100);});
  return [cands[0].id];
}
function seedType(t){
  var c=nodes.filter(function(n){return n.type===t;});return c.length?[c[0].id]:[];
}
function neighborsOf(id){
  var out=[];edges.forEach(function(e){
    if(e.a===id)out.push({id:e.b,e:e});if(e.b===id)out.push({id:e.a,e:e});});
  return out;
}
function runScenario(key){
  if(sim)stopSim(true);
  var sc=SCEN[key];var seeds=sc.seed();
  if(!seeds.length){toast('No '+key.toUpperCase()+' assets in this deployment/edition');return;}
  sim={key:key,name:sc.name,color:sc.color,overrides:{},waves:[],cost:0,affected:new Set(),
       events:[],t0:Date.now(),phase:'cascade'};
  document.querySelectorAll('.sc').forEach(function(el){el.classList.remove('running');});
  var btn=$('sc-'+key);btn.classList.add('running');btn.style.setProperty('--c',sc.color);
  $('stop-btn').disabled=false;
  $('hud-mode').textContent='SIMULATION — '+sc.name;
  $('live-dot').style.background=sc.color;$('live-dot').style.boxShadow='0 0 8px '+sc.color;
  shakeT=0.5;
  logEv(sc.msg,sc.color,true);
  // BFS wave scheduling
  var visited=new Set(seeds);
  var wave=seeds.slice();var depth=0;
  seeds.forEach(function(id){hit(id,depth);});
  var interval=setInterval(function(){
    if(!sim)return clearInterval(interval);
    depth++;
    var next=[];
    wave.forEach(function(id){
      neighborsOf(id).forEach(function(nb){
        if(visited.has(nb.id))return;
        var target=byId[nb.id];if(!target)return;
        // hubs pass-through cheaper; devices take real damage
        visited.add(nb.id);next.push(nb.id);
        // particle burst along the edge
        for(var k=0;k<3;k++)particles.push({e:nb.e,t:-k*0.15,v:0.02+Math.random()*0.012,col:sim.color});
        setTimeout(function(){if(sim)hit(nb.id,depth);}, 250);
      });
    });
    wave=next;
    if(!next.length||depth>6){
      clearInterval(interval);
      if(sim){
        sim.phase='hold';
        logEv('Cascade contained at depth '+depth+' — '+sim.affected.size+' assets impacted. Recovery in 6s\u2026','#8fa0bd');
        setTimeout(recover,6000);
      }
    }
  },900);
  sim.interval=interval;
  renderPanel();
}
function hit(id,depth){
  var n=byId[id];if(!n||!sim)return;
  if(n.core)return;
  var base=scoreOf(id);if(base===null)base=85;
  var dmg=n.hub? 20 : Math.max(12, 78-depth*16+Math.random()*10);
  var ns=Math.max(2,Math.round((base)-(dmg)));
  sim.overrides[id]=ns;
  if(!n.hub){
    sim.affected.add(id);
    var rate=COST[n.type]||8000;
    var impact=ns<20?0.95:ns<35?0.6:0.25;
    sim.cost+=rate*impact;
    if(ns<35)logEv('<b>'+n.label+'</b> degraded to '+ns+'/100 (depth '+depth+')',hcol(ns));
    if(n.type==='cbs_controller'&&ns<90){
      logEv('<b>CBS INTERLOCK TRIP</b> — blast authorisation suppressed','#ff4b68',true);
      shakeT=0.7;
    }
  }
  settle(30);renderPanel();
}
function recover(){
  if(!sim)return;
  sim.phase='recover';
  logEv('Recovery wave initiated — restoring by dependency order','#31e98c',true);
  var ids=Object.keys(sim.overrides);
  ids.forEach(function(id,i){
    setTimeout(function(){
      if(!sim)return;
      delete sim.overrides[id];
      var e=edges.find(function(ed){return ed.a===id||ed.b===id;});
      if(e)for(var k=0;k<2;k++)particles.push({e:e,t:-k*0.2,v:0.03,col:'#31e98c'});
      settle(10);renderPanel();
      if(i===ids.length-1){
        logEv('All assets restored. Simulation complete.','#31e98c',true);
        setTimeout(function(){stopSim(true);},1600);
      }
    }, i*260);
  });
  if(!ids.length)stopSim(true);
}
function stopSim(silent){
  if(sim&&sim.interval)clearInterval(sim.interval);
  var was=sim;sim=null;focusSet=selN?focusSet:null;
  document.querySelectorAll('.sc').forEach(function(el){el.classList.remove('running');});
  $('stop-btn').disabled=true;
  $('hud-mode').textContent='LIVE twin';
  $('live-dot').style.background='#31e98c';$('live-dot').style.boxShadow='0 0 8px #31e98c';
  if(!silent&&was)toast('Simulation stopped — back to live state');
  renderPanel();settle(40);
}
function logEv(html,col,strong){
  if(!sim)return;
  sim.events.unshift({html:html,col:col||'#00d4ff',t:new Date().toLocaleTimeString(),strong:strong});
  if(sim.events.length>40)sim.events.pop();
  renderPanel();
}

// ── side panel ──
function renderPanel(){
  var p=$('panel');var html='';
  if(sim){
    html+='<div class="pcard"><div class="pt" style="color:'+sim.color+'">'+sim.name
      +'<span class="x" onclick="stopSim()">stop &#x2715;</span></div>'
      +'<div class="imp-row"><span>Assets impacted</span><b style="color:'+sim.color+'">'+sim.affected.size+'</b></div>'
      +'<div class="imp-row"><span>Est. exposure</span><b style="color:#ffc94d">$'+Math.round(sim.cost).toLocaleString()+'/hr</b></div>'
      +'<div class="imp-row"><span>Phase</span><b>'+sim.phase+'</b></div></div>';
    html+='<div class="pcard"><div class="pt">Event stream</div><div id="evlog">'
      +sim.events.map(function(e){return '<div class="ev" style="--c:'+e.col+'"><time>'+e.t+'</time>'+(e.strong?'<b>':'')+e.html+(e.strong?'</b>':'')+'</div>';}).join('')
      +'</div></div>';
  }
  if(selN){
    var s=scoreOf(selN.id);
    var deps=neighborsOf(selN.id).filter(function(nb){return !String(nb.id).startsWith('__');});
    html+='<div class="pcard"><div class="pt">'+selN.label
      +'<span class="x" onclick="select(null)">&#x2715;</span></div>'
      +'<div class="nd-kv"><span>Type</span><b>'+(selN.type||'device')+'</b></div>'
      +'<div class="nd-kv"><span>Sector</span><b>'+((SECT[selN.sector]||{}).n||selN.sector||'—')+'</b></div>'
      +'<div class="nd-kv"><span>Health</span><b style="color:'+(s===null?'#4b5b78':hcol(s))+'">'+(s===null?'—':Math.round(s)+'/100')+'</b></div>'
      +'<div class="nd-kv"><span>Downtime rate</span><b>$'+((COST[selN.type]||8000)).toLocaleString()+'/hr</b></div>'
      +'<div class="nd-kv"><span>Direct dependencies</span><b>'+deps.length+'</b></div>'
      +'<div style="margin-top:10px;display:flex;gap:8px">'
      +'<button class="btn" style="height:30px;font-size:10.5px" onclick="seedFrom(\''+selN.id+'\')">&#x26A1; Fail this node</button>'
      +'</div></div>';
  }
  if(!html)html='<div class="pcard"><div class="pt">Cascade Studio</div>'
    +'<div style="font-size:11.5px;color:var(--sub);line-height:1.7">Run a scenario above to watch failures propagate through real dependencies, or click any node to inspect and fail it manually. Scroll to zoom &middot; drag to pan &middot; double-click to focus.</div></div>';
  p.innerHTML=html;
}
function seedFrom(id){
  if(sim)stopSim(true);
  var n=byId[id];if(!n)return;
  sim={key:'manual',name:'Manual failure — '+n.label,color:'#00d4ff',overrides:{},cost:0,
       affected:new Set(),events:[],t0:Date.now(),phase:'cascade'};
  $('stop-btn').disabled=false;
  $('hud-mode').textContent='SIMULATION — manual';
  logEv('Manual failure injected at <b>'+n.label+'</b>','#00d4ff',true);
  hit(id,0);
  var visited=new Set([id]);var wave=[id];var depth=0;
  sim.interval=setInterval(function(){
    if(!sim)return;
    depth++;var next=[];
    wave.forEach(function(w){neighborsOf(w).forEach(function(nb){
      if(visited.has(nb.id))return;visited.add(nb.id);next.push(nb.id);
      for(var k=0;k<3;k++)particles.push({e:nb.e,t:-k*0.15,v:0.024,col:'#00d4ff'});
      setTimeout(function(){if(sim)hit(nb.id,depth);},220);
    });});
    wave=next;
    if(!next.length||depth>5){clearInterval(sim.interval);
      if(sim){sim.phase='hold';setTimeout(recover,5000);}}
  },850);
  renderPanel();
}

// ── live refresh (when not simulating, twin follows reality) ──
async function refreshLive(){
  try{
    var d=await(await fetch(B+'/api/snapshot',{cache:'no-store'})).json();
    (d.data||[]).forEach(function(r){
      live[r.device_id]=r.health_score;
      if(!byId[r.device_id])
        {addDeviceNode(r);index();settle(80);
         $('hud-n').textContent=nodes.filter(function(n){return !n.hub&&!n.core;}).length;
         $('hud-e').textContent=edges.length;}
    });
  }catch(e){}
}

// ── boot ──
(function(){
  cv=$('cv');ctx=cv.getContext('2d');
  resize();bind();loop();
  loadTopology();
  setInterval(refreshLive,12000);
  renderPanel();
})();
